# render.yaml — Configuración de deploy en Render (Python Runtime)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: manguito
    runtime: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "8081"
