services:
  - type: web
    name: manguito-finanzas
    env: python
    region: ohio # Podés cambiarlo si usabas otra
    plan: free
    buildCommand: |
      # 1. Construir el Frontend (React/Vite)
      cd frontend
      npm install
      npm run build
      cd ..
      
      # 2. Instalar dependencias del Backend (FastAPI)
      pip install -r requirements.txt
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0 # Versión estable recomendada
      # Las demás variables (JWT_SECRET, DATABASE_URL, GOOGLE_CLIENT_ID) 
      # el usuario las configura manualmente en el dashboard de Render.
