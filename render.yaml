# render.yaml — Configuración de deploy en Render (Docker)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: manguito
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: "8443"  # Render inyecta PORT automáticamente, este es un valor sugerido
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
