<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFE6AD">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Manguito — Tu dashboard de finanzas personales con IA">
    <title>Manguito — Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- ═══ PANTALLA DE LOGIN ═══ -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="login-logo"><img src="/static/icon-192.png" alt="Manguito" class="login-logo-img"></div>
            <h1 class="login-title">Manguito</h1>
            <p class="login-subtitle">Tu copiloto financiero</p>
            <div class="login-card">

                <!-- TABS -->
                <div class="login-tabs">
                    <button id="tab-login" onclick="switchTab('login')" class="login-tab active">Entrar</button>
                    <button id="tab-register" onclick="switchTab('register')" class="login-tab">Registrarse</button>
                    <button id="tab-token" onclick="switchTab('token')" class="login-tab">Telegram</button>
                </div>

                <!-- PANEL LOGIN -->
                <div id="panel-login" class="flex-col gap-3">
                    <input type="email" id="login-email" class="form-input" placeholder="Email" autocomplete="email">
                    <input type="password" id="login-password" class="form-input" placeholder="Contraseña" autocomplete="current-password">
                    <button id="btn-login-email" class="btn-primary w-full mt-2">Entrar</button>
                    <a href="/api/auth/google" class="btn-secondary w-full flex-row items-center justify-center gap-2" style="text-decoration:none;">
                    	<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                        Continuar con Google
                    </a>
                </div>

                <!-- PANEL REGISTER -->
                <div id="panel-register" class="flex-col gap-5" style="display:none;">
                    <input type="text" id="reg-nombre" class="form-input" placeholder="Tu nombre" autocomplete="name">
                    <input type="email" id="reg-email" class="form-input" placeholder="Email" autocomplete="email">
                    <input type="password" id="reg-password" class="form-input" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="new-password">
                    <button id="btn-register" class="btn-primary w-full mt-2">Crear cuenta</button>
                    <a href="/api/auth/google" class="btn-secondary w-full flex-row items-center justify-center gap-2" style="text-decoration:none;">
                    	<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                        Registrarse con Google
                    </a>
                </div>

                <!-- PANEL TELEGRAM -->
                <div id="panel-token" style="display:none;">
                    <p style="color:var(--text-secondary);font-size:0.85rem;text-align:center;margin-bottom:14px;line-height:1.5;">
                        Usá el comando <code style="background:var(--accent-glow);color:var(--accent);padding:2px 8px;border-radius:4px;font-weight:600;">/web</code> en el bot y el link te traerá directo acá logueado.
                    </p>
                    <div class="login-input-group">
                        <input type="text" id="input-token" placeholder="O pegá tu token acá..." autocomplete="off">
                        <button id="btn-login" class="btn-primary">Entrar</button>
                    </div>
                </div>

                <p id="login-error" style="color:var(--red);font-size:0.85rem;text-align:center;margin-top:12px;min-height:18px;"></p>
            </div>
        </div>
    </div>

    <!-- ═══ DASHBOARD ═══ -->
    <div id="app-screen" class="screen">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <img src="/static/icon-192.png" alt="Manguito" class="top-logo-img">
                <span class="top-title">Manguito</span>
            </div>
            <div class="top-bar-right">
                <button id="btn-refresh" class="icon-btn" title="Actualizar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path></svg>
                </button>
                <button id="btn-logout" class="icon-btn" title="Salir">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <main id="main-content" class="main-content">
            <!-- Se llena dinámicamente -->
        </main>

        <!-- Bottom Navigation (5 Tabs) -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-page="dashboard">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Inicio</span>
            </button>
            <button class="nav-btn" data-page="movimientos">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"></path></svg>
                <span>Movimientos</span>
            </button>
            <button class="nav-btn nav-btn-add" data-page="agregar">
                <div class="nav-add-circle">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </div>
            </button>
            <button class="nav-btn" data-page="aprender">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                <span>Aprender</span>
            </button>
            <button class="nav-btn" data-page="mas">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                <span>Más</span>
            </button>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
